backend:
  name: github
  repo: 24haoniupai/biye007-cms
  branch: main
  base_url: https://biye007-cms.hot0001.workers.dev
  auth_endpoint: /api/auth

publish_mode: editorial_workflow

# 本地开发时可用测试后端（不需要 GitHub）
# local_backend: true

media_folder: public/assets
public_folder: /assets

locale: zh_Hans


collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", required: false }
      - { label: "文章摘要", name: "description", widget: "text", required: false }

      - label: "文章分类"
        name: "category"
        widget: "select"
        options:
          - { label: "美国大学", value: "美国大学" }
          - { label: "学业问题", value: "学业问题" }
          - { label: "申诉与解决方案", value: "申诉与解决方案" }
          - { label: "留学资讯", value: "留学资讯" }
          - { label: "学历与认证", value: "学历与认证" }

      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "发布日期", name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "更新日期", name: "updatedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }

      - { label: "封面图", name: "coverImage", widget: "image", required: false }
      - { label: "封面图片说明（Alt）", name: "coverImageAlt", widget: "string", required: false }
      - { label: "横幅图", name: "heroImage", widget: "image", required: false }

      - { label: "SEO标题", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO描述", name: "seoDescription", widget: "text", required: false }

      - { label: "作者", name: "author", widget: "string", default: "biye007" }
      - { label: "首页置顶", name: "featured", widget: "boolean", default: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: true }

      - { label: "正文", name: "body", widget: "markdown" }

  - name: pages
    label: 页面
    files:
      - name: home
        label: 首页说明
        file: src/content/pages/home.md
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "正文", name: "body", widget: "markdown" }
