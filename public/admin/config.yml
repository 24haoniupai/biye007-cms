backend:
  name: github
  repo: 你的GitHub用户名/biye007-cms
  branch: main
  base_url: https://www.biye007.abrdns.com  # 你的域名，用于 OAuth 回调
  auth_endpoint: /api/auth

# 本地开发时可用测试后端（不需要 GitHub）
# local_backend: true

media_folder: public/assets
public_folder: /assets

locale: zh_Hans

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "描述 / 摘要", name: "description", widget: "string", required: false }
      - { label: "发布日期", name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "封面图", name: "coverImage", widget: "image", required: false }
      - { label: "横幅图", name: "heroImage", widget: "image", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: pages
    label: 页面
    files:
      - name: home
        label: 首页说明
        file: src/content/pages/home.md
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "正文", name: "body", widget: "markdown" }
